<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MERA | Az oldal nem található</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f3e9db">
<style>
  :root { --bg:#fffdf7; --panel:#f6f1eb; --line:#d8c7b5; --ink:#403c35; --muted:#65523a; --gold:#805b35; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:32px 16px;
         background:var(--bg); color:var(--ink);
         font-family:Georgia,'Times New Roman',serif; line-height:1.6; }
  main { max-width:30rem; text-align:center; }
  .mark { font-size:1.4rem; letter-spacing:.3em; color:var(--gold); font-weight:700; margin-bottom:1.5rem; }
  .code { font-size:4rem; margin:0; color:var(--gold); }
  h1 { font-size:1.5rem; margin:.25rem 0 1rem; }
  p { margin:0 0 1.75rem; color:var(--muted); }
  .en { font-size:.95rem; color:var(--muted); }
  a.button { display:inline-block; padding:.8rem 1.6rem; border:1px solid var(--line); border-radius:999px;
             background:var(--panel); color:var(--ink); text-decoration:none; font-size:1rem; }
  a.button:hover { background:#fff; }
</style>
</head>
<body>
<main>
  <div class="mark">MERA</div>
  <p class="code">404</p>
  <h1>Ez az oldal nem található</h1>
  <p>Lehet, hogy a cím elavult, vagy elírás történt.
     <span class="en"><br>This page could not be found.</span></p>
  <a class="button" href="/">Vissza a főoldalra</a>
</main>
</body>
</html>
